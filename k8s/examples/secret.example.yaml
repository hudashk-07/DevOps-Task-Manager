# EXAMPLE ONLY - not applied by "kubectl apply -f k8s/" (sub-directories are skipped).
# ./run.sh deploy k8s (and the CI workflow) create this Secret with a random password
# if it does not exist. To set your own, run:
#   kubectl create secret generic task-manager-secret -n devops-task-manager \
#     --from-literal=MONGO_USERNAME=admin --from-literal=MONGO_PASSWORD='<letters-and-digits-only>'
# Never change the password of an existing MongoDB volume this way: MongoDB only reads
# MONGO_INITDB_ROOT_* on first initialisation, so the API would lose access.
apiVersion: v1
kind: Secret
metadata:
  name: task-manager-secret
  namespace: devops-task-manager
type: Opaque
stringData:
  MONGO_USERNAME: "admin"
  MONGO_PASSWORD: "CHANGE_ME_letters_and_digits_only"
