# API + MongoDB for local use.
#
# MongoDB is reachable only on the internal Docker network (mongodb://mongo:27017),
# so it can never clash with a MongoDB already running on the host's port 27017.
# To reach it from the host (e.g. "npm start"), add the override file:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Host ports are configurable: API_HOST_PORT (default 5000), MONGO_HOST_PORT (default 27017, dev override only).
name: devops-task-manager

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - task-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-task-manager:1.0
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: "5000"
      MONGO_URI: mongodb://mongo:27017/devops_tasks
    ports:
      - "${API_HOST_PORT:-5000}:5000"
    networks:
      - task-network

volumes:
  mongo_data:

networks:
  task-network:
    driver: bridge
